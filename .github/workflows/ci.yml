# ci.yml — GitHub Actions CI pipeline for MiniPay.
# Owns: lint, test, build verification on every pull request.
# Must never: deploy or touch production.
# Depends on: Go 1.25, golangci-lint.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...
      - name: go vet
        run: go vet ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests
        run: go test -race -shuffle=on -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build binary
        run: go build -v -o minipay ./cmd/minipay
