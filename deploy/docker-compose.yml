# docker-compose.yml — Local development environment for MiniPay.
# Owns: Postgres 16, Redis 7 containers for local dev and integration tests.
# Must never: contain production secrets or run the app containers (that's for later).
# Depends on: Docker Compose v2.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: minipay
      POSTGRES_DB: minipay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipay"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

